{% extends 'base.html' %}
{% block title %}Join | PawHaven{% endblock %}
{% block content %}<section class="auth-page"><div><span class="eyebrow">Join PawHaven</span><h1>Make room for a little more love.</h1><p>Create an account to apply for pets and follow every step.</p></div><form class="card-form" method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}{% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>{% endfor %}<button class="button primary full" type="submit">Create account</button></form></section>{% endblock %}
